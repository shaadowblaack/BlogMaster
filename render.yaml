services:
  # Backend API server (also serves frontend static files)
  - type: web
    name: blog-master
    runtime: node
    nodeVersion: "22"
    plan: starter
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_USERNAME
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
